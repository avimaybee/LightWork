name = "lightwork"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# D1 Database binding (existing)
[[d1_databases]]
binding = "DB"
database_name = "bananabatch-db"
database_id = "268599ef-2c76-41cf-8202-447ba8d43d33"

# R2 Storage binding (existing)
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "bananabatch-storage"

# Environment variables
[vars]
ENVIRONMENT = "production"
# R2 bucket name for presigned URLs (same as bucket_name above)
R2_BUCKET = "bananabatch-storage"

# --- SECRETS (set via `wrangler secret put`) ---
# R2_ACCESS_KEY_ID - Generate from Cloudflare Dashboard -> R2 -> Manage R2 API Tokens
# R2_SECRET_ACCESS_KEY - The secret from the API token
# R2_ACCOUNT_ID - Your Cloudflare account ID
# GEMINI_API_KEY - Google AI API key
# FREE_GEMINI_API_KEY - Optional: separate free-tier key for OCR/search

